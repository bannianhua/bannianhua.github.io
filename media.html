<script src="js/site.js"></script>
<script>
(function () {
  var lite = !!window.SITE.lite;
  var list = window.SITE.media || [];
  var host = document.getElementById('video-list');
  var html = '';
  list.forEach(function (m) {
    html +=
      '<div class="video-card">' +
      '<div class="vc-head"><h3>✦ ' + m.title + '</h3><span class="vc-date">' + m.date + ' · ' + m.id + '</span></div>' +
      '<video controls preload="none" playsinline src="' + m.src + '"></video>' +
      '<div class="vc-actions">' +
      (m.orig ? '<a class="btn small" href="' + m.orig + '" target="_blank" rel="noopener" title="' + m.origName + '">原片下载 ⬇</a>' : '') +
      '</div>' +
      '<p class="vc-note">' + (lite
        ? '※ 精简版提供压缩影像在线播放；原片请使用电脑版资源站。'
        : '※ 在线播放为网页版 mp4；原片（' + m.origName + '）保存在本地《熙叆》文件夹。') + '</p>' +
      '</div>';
  });
  host.innerHTML = html;

  var bgm = window.SITE.bgm;
  document.getElementById('bgm-title').textContent = '♪ ' + bgm.title;
  var orig = document.getElementById('bgm-orig');
  if (bgm.orig) {
    orig.href = bgm.orig;
    orig.title = '原声：' + bgm.origName;
  } else {
    orig.style.display = 'none';
  }
  var player = document.getElementById('bgm-player');
  var statusEl = document.getElementById('bgm-status');
  player.src = bgm.src;
  player.load();

  /* 与全站背景音乐共享播放状态：从上次进度续播，并把状态写回 localStorage */
  try {
    if (localStorage.getItem("xi'ai_bgm_on") === '1') {
      var savedT = parseFloat(localStorage.getItem("xi'ai_bgm_time") || '0');
      if (!isNaN(savedT) && savedT > 0) {
        // 音频就绪后再定位（过早 seek 会被重置）
        var seekDone = false;
        player.addEventListener('loadedmetadata', function () {
          if (seekDone) return;
          seekDone = true;
          try { if (Math.abs(player.currentTime - savedT) > 2) player.currentTime = savedT; } catch (e) { }
        }, { once: true });
      }
    }
  } catch (e) { }
  function bgmSave() {
    try {
      localStorage.setItem("xi'ai_bgm_on", player.paused ? '0' : '1');
      localStorage.setItem("xi'ai_bgm_time", String(player.currentTime || 0));
    } catch (e) { }
  }
  player.addEventListener('play', function () {
    if (player.muted) player.muted = false; // 静音启动后立即出声
    bgmSave();
  });
  player.addEventListener('pause', bgmSave);
  window.addEventListener('pagehide', bgmSave); // 跳转/关闭时精确保存
  setInterval(function () {
    if (!player.paused) {
      try { localStorage.setItem("xi'ai_bgm_time", String(player.currentTime || 0)); } catch (e) { }
    }
  }, 3000);

  /* 自动播放：静音启动（浏览器必允许 muted autoplay），出声瞬间恢复音量；
     多时机反复尝试（音频就绪 / 页面加载完成 / 延迟重试） */
  var fallbackArmed = false;
  function tryPlay() {
    if (!player.paused) return;
    player.muted = true;
    var p = player.play();
    if (p && p.catch) {
      p.then(function () {
        statusEl.textContent = '♪ 主题音乐已自动播放';
      }).catch(function () {
        player.muted = false;
        statusEl.textContent = '♪ 浏览器拦截了自动播放，点击页面任意处开始播放音乐';
        if (!fallbackArmed) armFallback();
      });
    }
  }
  player.addEventListener('loadedmetadata', tryPlay);
  player.addEventListener('canplay', tryPlay);
  window.addEventListener('load', tryPlay);
  setTimeout(tryPlay, 1000);
  setTimeout(tryPlay, 3000);
  function armFallback() {
    var started = false;
    ['click', 'touchstart', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        if (started) return;
        started = true;
        player.play().then(function () {
          statusEl.textContent = '♪ 主题音乐已开始播放';
        }).catch(function () { });
      }, { once: true });
    });
  }
  tryPlay();
})();
</script>
